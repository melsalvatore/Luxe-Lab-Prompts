<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Luxe Lab — Prompt</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0a10;
    color: #ffffff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    padding: 55px 20px;
}

/* LOGO */

.logo {
    text-align: center;
    margin-bottom: 55px;
}

.logo h1 {
    margin: 0;
    font-size: 48px;
    letter-spacing: 5px;
    font-weight: 700;
}

.logo p {
    margin-top: 12px;
    font-size: 20px;
    letter-spacing: 2px;
    color: #c7b4d8;
}

/* CARD */

.card {
    background: #15121b;
    border: 1px solid #3b3045;
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.35);
}

.title {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 10px;
}

.subtitle {
    color: #b9adbf;
    font-size: 17px;
    margin-bottom: 25px;
}

/* PROMPT */

.prompt-box {
    background: #08070b;
    border: 1px solid #2e2835;
    border-radius: 20px;
    padding: 25px;
    font-size: 16px;
    line-height: 1.7;
    color: #eeeeee;
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* BOTÃO */

.copy-button {
    width: 100%;
    margin-top: 20px;
    padding: 18px;
    border: none;
    border-radius: 16px;
    background: #ffffff;
    color: #08070b;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.copy-button:hover {
    transform: scale(1.01);
}

.copy-button:active {
    transform: scale(0.98);
}

/* RODAPÉ */

.footer {
    text-align: center;
    margin-top: 45px;
    color: #756b7c;
    font-size: 14px;
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <h1>LUXE LAB</h1>
        <p>PROMPT EXCLUSIVO</p>
    </div>


    <div class="card">

        <div class="title">
            ✦ Prompt do dia
        </div>

        <div class="subtitle">
            Copie o prompt abaixo e utilize na sua criação.
        </div>


        <div class="prompt-box" id="prompt">

COLE SEU PROMPT AQUI

        </div>


        <button class="copy-button" onclick="copiarPrompt()">
            📋 COPIAR PROMPT
        </button>

    </div>


    <div class="footer">
        © 2026 Luxe Lab • Prompts exclusivos
    </div>

</div>


<script>

function copiarPrompt() {

    const prompt = document.getElementById("prompt").innerText;

    navigator.clipboard.writeText(prompt).then(() => {

        const botao = document.querySelector(".copy-button");

        const textoOriginal = botao.innerText;

        botao.innerText = "✓ PROMPT COPIADO!";

        setTimeout(() => {
            botao.innerText = textoOriginal;
        }, 1800);

    });

}

</script>

</body>
</html>
